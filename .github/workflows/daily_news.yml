name: Daily Cyber News Update

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest cyber news
        run: python fetch_news.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "quadrijunaid369258@gmail.com"

      - name: Commit and push changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes detected, skipping commit."
          else
            git add README.md
            git commit -m "Automated daily cyber news update"
            git push
          fi
